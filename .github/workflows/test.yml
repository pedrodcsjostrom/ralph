name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Python and the newest.
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.x"
          # The Python that ships with macOS's command line tools, as a runner has it.
          - os: macos-latest
            python: system
          - os: macos-latest
            python: "3.x"
    steps:
      - uses: actions/checkout@v4
      - if: matrix.python != 'system'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        run: |
          if [ "${{ matrix.python }}" = system ]; then python=/usr/bin/python3; else python=python; fi
          "$python" --version
          git --version
          "$python" -m unittest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .
